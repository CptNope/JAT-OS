<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15181e"><title>Memory Match — JAT Arcade</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;padding:16px;background:#15181e;color:#eef1f6;display:grid;place-items:center;font:15px/1.5 system-ui,sans-serif}main{text-align:center;width:min(100%,620px)}h1{font-size:clamp(25px,5vw,34px);margin:0 0 6px}p{color:#b7c2d5;margin:8px 0 14px}button{touch-action:manipulation;cursor:pointer;background:#2f6bff;color:#fff;border:1px solid #86aaff;border-radius:9px;padding:10px 14px;font:600 15px system-ui}button:focus-visible{outline:3px solid white;outline-offset:3px}button:disabled{opacity:.6;cursor:default}.hud{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;align-items:center;margin:14px 0}.stat{background:#252f40;border-radius:9px;padding:9px 15px}canvas{width:100%;display:block;border-radius:12px;background:#0d1726;touch-action:none;border:2px solid #3a4c64}.pad{display:flex;justify-content:center;gap:12px;margin:12px}.pad button{min-width:74px}small{color:#a4b1c3}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(100%,460px);margin:14px auto}.card{aspect-ratio:1;padding:0;font-size:clamp(24px,6vw,42px);background:#344868;border:2px solid #617caa}.card.revealed{background:#e6edf7;color:#243043}.card:disabled{opacity:1;background:#4a9d83;color:#fff}</style></head><body><main><h1>Memory Match</h1><p>Flip cards and find all eight matching pairs.</p><div class="hud"><span class="stat">Moves: <b id="moves">0</b></span><span class="stat">Pairs: <b id="pairs">0</b>/8</span><button id="reset">Shuffle</button></div><div class="board" id="board" role="grid" aria-label="Memory matching cards"></div><p id="msg" aria-live="polite">Tap any two cards to reveal them.</p><small>JAT Arcade · Plays directly in your browser</small></main><script>const B=document.querySelector('#board'),M=document.querySelector('#moves'),P=document.querySelector('#pairs'),T=document.querySelector('#msg'),symbols=['◆','●','▲','★','♣','♥','☀','♫'];let deck,open,matched,moves,locked,turn=0;function shuffle(){turn++;deck=[...symbols,...symbols].map((v,i)=>({v,id:i}));for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}open=[];matched=new Set();moves=0;locked=false;T.textContent='Choose two cards.';paint()}function paint(){B.replaceChildren();deck.forEach((c,i)=>{let up=open.includes(i)||matched.has(i),b=document.createElement('button');b.className='card'+(up?' revealed':'');b.textContent=up?c.v:'?';b.setAttribute('aria-label',up?c.v:'Hidden card '+(i+1));b.disabled=matched.has(i);b.onclick=()=>pick(i);B.append(b)});M.textContent=moves;P.textContent=matched.size/2}function pick(i){if(locked||matched.has(i)||open.includes(i))return;open.push(i);paint();if(open.length===2){moves++;const [a,b]=open;if(deck[a].v===deck[b].v){matched.add(a);matched.add(b);open=[];T.textContent=matched.size===16?'You found all pairs!':'Matched!';paint()}else{locked=true;let now=turn;setTimeout(()=>{if(turn!==now)return;open=[];locked=false;paint()},800)}}}document.querySelector('#reset').onclick=shuffle;shuffle();</script></body></html>
