<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15181e"><title>2048 — JAT Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#15181e;color:#f1f3f7;font:15px/1.4 system-ui,sans-serif;min-height:100dvh;display:grid;place-items:center;padding:16px}main{width:min(100%,570px);text-align:center}h1{margin:0 0 8px;font-size:clamp(24px,4vw,36px)}p{margin:6px 0 14px;color:#b6bfd0}button{background:#285ee6;border:1px solid #6490ff;color:white;font:inherit;font-weight:600;padding:10px 15px;border-radius:9px;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid white;outline-offset:3px}.stats{display:flex;justify-content:center;gap:16px;align-items:center;flex-wrap:wrap;margin:12px 0}.panel{padding:6px 14px;background:#252c39;border-radius:9px}.board{margin:12px auto;touch-action:none}small{color:#b6bfd0} .board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#303b4b;padding:10px;border-radius:14px;width:min(100%,430px);aspect-ratio:1}.tile{display:grid;place-items:center;border-radius:8px;background:#4d5c72;color:#fff;font-size:clamp(19px,5vw,34px);font-weight:800}.tile[data-v="0"]{color:transparent;background:#394456}.tile[data-v="2"],.tile[data-v="4"]{background:#e1e5ed;color:#1e293b}.tile[data-v="8"],.tile[data-v="16"]{background:#eaa46b;color:#1e293b}.tile[data-v="32"],.tile[data-v="64"]{background:#ee775d}.tile[data-v="128"],.tile[data-v="256"],.tile[data-v="512"],.tile[data-v="1024"],.tile[data-v="2048"]{background:#e6c45b;color:#253047}.controls{display:grid;grid-template-columns:repeat(3,58px);justify-content:center;gap:5px;margin:12px}</style></head><body><main><h1>2048</h1><p>Combine matching tiles. Reach 2048!</p><div class="stats"><span class="panel">Score <b id="score">0</b></span><span class="panel">Best <b id="best">0</b></span><button id="new">New game</button></div><div class="board" id="board" role="grid" aria-label="2048 tile grid"></div><p id="status" aria-live="polite">Use arrow keys, swipe, or buttons.</p><div class="controls"><span></span><button data-dir="up" aria-label="Up">↑</button><span></span><button data-dir="left" aria-label="Left">←</button><button data-dir="down" aria-label="Down">↓</button><button data-dir="right" aria-label="Right">→</button></div><small>JAT Arcade • Keyboard and touch controls</small></main><script>const B=document.querySelector('#board'),S=document.querySelector('#score'),H=document.querySelector('#best'),T=document.querySelector('#status');let a=[],score=0,won=false;let best=Number(localStorage.getItem('jat-2048-best')||0);H.textContent=best;function add(){let empty=a.map((v,i)=>v?-1:i).filter(i=>i>=0);if(empty.length)a[empty[Math.floor(Math.random()*empty.length)]]=Math.random()<.9?2:4}function paint(){B.replaceChildren(...a.map(v=>{let el=document.createElement('div');el.className='tile';el.dataset.v=v;el.textContent=v||'0';el.setAttribute('role','gridcell');el.setAttribute('aria-label',v?String(v):'Empty');return el}));S.textContent=score;if(score>best){best=score;H.textContent=best;localStorage.setItem('jat-2048-best',best)}}function start(){a=Array(16).fill(0);score=0;won=false;add();add();T.textContent='Use arrow keys, swipe, or buttons.';paint()}function process(line){let v=line.filter(Boolean),out=[];for(let i=0;i<v.length;i++){if(v[i]===v[i+1]){out.push(v[i]*2);score+=v[i]*2;i++}else out.push(v[i])}while(out.length<4)out.push(0);return out}function move(d){let before=a.join(','),b=Array(16).fill(0);for(let k=0;k<4;k++){let ids=[];for(let i=0;i<4;i++){ids.push(d==='left'?k*4+i:d==='right'?k*4+3-i:d==='up'?i*4+k:(3-i)*4+k)}let result=process(ids.map(i=>a[i]));ids.forEach((idx,j)=>b[idx]=result[j])}a=b;if(a.join(',')===before)return;add();paint();if(a.includes(2048)&&!won){won=true;T.textContent='You reached 2048! Keep going.'}else if(a.every(Boolean)&&!['up','down','left','right'].some(x=>can(x)))T.textContent='Game over. Start a new game.'}function can(d){for(let k=0;k<4;k++)for(let i=0;i<3;i++){let x=d==='left'?k*4+i:d==='right'?k*4+3-i:d==='up'?i*4+k:(3-i)*4+k,y=d==='left'?x+1:d==='right'?x-1:d==='up'?x+4:x-4;if(a[x]===a[y])return true}return false}document.querySelector('#new').onclick=start;document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>move(b.dataset.dir));document.addEventListener('keydown',e=>{let d={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(d){e.preventDefault();move(d)}});let sx=0,sy=0;B.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});B.addEventListener('pointerup',e=>{let dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>25)move(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up')});start();</script><script src="../controller.js" defer></script></body></html>
