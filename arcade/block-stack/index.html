<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15181e"><title>Block Stack — JAT Arcade</title><style>*{box-sizing:border-box}body{margin:0;background:#15181e;color:#eef1f6;font:15px/1.45 system-ui;min-height:100dvh;display:grid;place-items:center;padding:14px}main{text-align:center;width:min(100%,450px)}h1{margin:0;font-size:30px}p{color:#b7c2d5}canvas{display:block;margin:10px auto;background:#0e1a2b;border:2px solid #5c708c;border-radius:9px;max-width:100%;max-height:min(58dvh,600px);touch-action:none;image-rendering:pixelated}button{background:#2f6bff;border:1px solid #7ba2ff;color:white;font:600 15px system-ui;border-radius:8px;padding:10px 12px;touch-action:manipulation;cursor:pointer}button:focus-visible{outline:3px solid white;outline-offset:3px}.hud,.pad{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:7px;margin:9px auto}.hud span{background:#252f40;padding:9px;border-radius:8px}small{color:#b6bfd0}</style></head><body><main><h1>Block Stack</h1><p>Fit falling pieces together. Clear horizontal lines to score.</p><div class="hud"><span>Score: <b id="score">0</b></span><span>Lines: <b id="lines">0</b></span><button id="pause">Start / Pause</button><button id="reset">New game</button></div><canvas id="board" width="300" height="600" aria-label="Falling block puzzle board"></canvas><div class="pad"><button data-d="left">←</button><button data-d="turn">Rotate</button><button data-d="right">→</button><button data-d="down">↓</button><button data-d="drop">Drop</button></div><p id="msg" aria-live="polite">Use arrow keys, space, or the buttons.</p><small>JAT Arcade · Original browser game</small></main><script>
const cvs=document.querySelector('#board'),ctx=cvs.getContext('2d'),S=document.querySelector('#score'),L=document.querySelector('#lines'),M=document.querySelector('#msg');const W=10,H=20,C=30,SHAPES=[[[1,1,1,1]],[[2,2],[2,2]],[[0,3,0],[3,3,3]],[[0,4,4],[4,4,0]],[[5,5,0],[0,5,5]],[[6,0,0],[6,6,6]],[[0,0,7],[7,7,7]]],COLORS=['','#55d3f3','#f3d36b','#b48cff','#60deb0','#f38c9a','#7d9df6','#f4af78'];let board,piece,score=0,lines=0,running=false,over=false,timer=null;
function copy(m){return m.map(r=>r.slice())}function spawn(){let m=copy(SHAPES[Math.floor(Math.random()*SHAPES.length)]);piece={m,x:Math.floor((W-m[0].length)/2),y:0};if(collide(piece.x,piece.y,piece.m)){over=true;running=false;stop();M.textContent='Game over. Start a new game.'}}function collide(px,py,m){return m.some((r,y)=>r.some((v,x)=>v&&(px+x<0||px+x>=W||py+y>=H||(py+y>=0&&board[py+y][px+x]))))}function draw(){ctx.fillStyle='#0e1a2b';ctx.fillRect(0,0,300,600);function cell(x,y,v){ctx.fillStyle=COLORS[v];ctx.fillRect(x*C+1,y*C+1,C-2,C-2);ctx.strokeStyle='#ffffff33';ctx.strokeRect(x*C+2,y*C+2,C-4,C-4)}board.forEach((r,y)=>r.forEach((v,x)=>{if(v)cell(x,y,v)}));if(piece)piece.m.forEach((r,y)=>r.forEach((v,x)=>{if(v&&piece.y+y>=0)cell(piece.x+x,piece.y+y,v)}));ctx.strokeStyle='#ffffff13';for(let i=1;i<W;i++){ctx.beginPath();ctx.moveTo(i*C,0);ctx.lineTo(i*C,600);ctx.stroke()}for(let i=1;i<H;i++){ctx.beginPath();ctx.moveTo(0,i*C);ctx.lineTo(300,i*C);ctx.stroke()}}function stop(){if(timer){clearInterval(timer);timer=null}document.querySelector('#pause').textContent='Start / Pause'}function reset(){stop();board=Array.from({length:H},()=>Array(W).fill(0));score=lines=0;over=false;piece=null;S.textContent=0;L.textContent=0;spawn();M.textContent='Press Start to play.';draw()}function rotate(){if(!running)return;let a=piece.m,m=a[0].map((_,i)=>a.map(row=>row[i]).reverse());for(let dx of [0,-1,1,-2,2])if(!collide(piece.x+dx,piece.y,m)){piece.x+=dx;piece.m=m;draw();return}}function lock(){piece.m.forEach((r,y)=>r.forEach((v,x)=>{if(v&&piece.y+y>=0)board[piece.y+y][piece.x+x]=v}));let cleared=0;for(let y=H-1;y>=0;y--)if(board[y].every(Boolean)){board.splice(y,1);board.unshift(Array(W).fill(0));cleared++;y++}lines+=cleared;score+=[0,100,300,500,800][cleared];S.textContent=score;L.textContent=lines;spawn()}function fall(){if(!running)return;if(!collide(piece.x,piece.y+1,piece.m))piece.y++;else lock();draw()}function move(dx){if(!running)return;if(!collide(piece.x+dx,piece.y,piece.m))piece.x+=dx;draw()}function drop(){if(!running)return;while(!collide(piece.x,piece.y+1,piece.m)){piece.y++;score+=2}lock();S.textContent=score;draw()}function action(d){if(d==='turn')rotate();else if(d==='left')move(-1);else if(d==='right')move(1);else if(d==='down')fall();else if(d==='drop')drop()}document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>action(b.dataset.d));document.querySelector('#reset').onclick=reset;document.querySelector('#pause').onclick=()=>{if(over)reset();running=!running;if(running){timer=setInterval(fall,Math.max(125,620-lines*9));M.textContent='Stack the pieces!'}else{stop();M.textContent='Paused.'}};document.addEventListener('keydown',e=>{let d={ArrowLeft:'left',ArrowRight:'right',ArrowDown:'down',ArrowUp:'turn',' ':'drop'}[e.key];if(d){e.preventDefault();action(d)}});let sx=0,sy=0;cvs.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});cvs.addEventListener('pointerup',e=>{let dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)<15&&Math.abs(dy)<15)action('turn');else if(Math.abs(dx)>Math.abs(dy))action(dx>0?'right':'left');else action(dy>0?'drop':'turn')});document.addEventListener('visibilitychange',()=>{if(document.hidden&&running){running=false;stop();M.textContent='Paused while away.'}});reset();
</script></body></html>
