<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15181e"><title>Minesweeper — JAT Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#15181e;color:#f1f3f7;font:15px/1.4 system-ui,sans-serif;min-height:100dvh;display:grid;place-items:center;padding:16px}main{width:min(100%,570px);text-align:center}h1{margin:0 0 8px;font-size:clamp(24px,4vw,36px)}p{margin:6px 0 14px;color:#b6bfd0}button{background:#285ee6;border:1px solid #6490ff;color:white;font:inherit;font-weight:600;padding:10px 15px;border-radius:9px;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid white;outline-offset:3px}.stats{display:flex;justify-content:center;gap:16px;align-items:center;flex-wrap:wrap;margin:12px 0}.panel{padding:6px 14px;background:#252c39;border-radius:9px}.board{margin:12px auto;touch-action:none}small{color:#b6bfd0} .board{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;width:min(100%,450px);aspect-ratio:1;padding:6px;background:#263145;border-radius:12px}.cell{display:grid;place-items:center;border:0;border-radius:5px;min-width:0;padding:0;background:#445370;color:#fff;font-size:clamp(14px,4vw,23px);font-weight:800}.cell.open{background:#222b3b}.cell.mine{background:#b63e50}.cell.flag{color:#ffd376}.cell:focus-visible{outline:2px solid white;outline-offset:-2}.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}</style></head><body><main><h1>Minesweeper</h1><p>Find eight mines. First reveal is always safe.</p><div class="stats"><span class="panel">Mines <b id="left">8</b></span><span class="panel">Time <b id="time">0</b>s</span><button id="reset">New game</button></div><div class="actions"><button id="mode" aria-pressed="false">Mode: Reveal</button></div><div class="board" id="board" role="grid" aria-label="Minesweeper board"></div><p id="status" aria-live="polite">Tap to reveal. Long-press, right-click or switch to Flag mode.</p><small>JAT Arcade • Keyboard and touch controls</small></main><script>const N=9,M=8,B=document.querySelector('#board'),L=document.querySelector('#left'),TM=document.querySelector('#time'),T=document.querySelector('#status'),mode=document.querySelector('#mode');let mines,open,flags,started,ended,sec,timer,flagMode=false,cells=[];function near(i){let x=i%N,y=Math.floor(i/N),a=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){let nx=x+dx,ny=y+dy;if((dx||dy)&&nx>=0&&nx<N&&ny>=0&&ny<N)a.push(ny*N+nx)}return a}function reset(){clearInterval(timer);mines=new Set();open=new Set();flags=new Set();started=false;ended=false;sec=0;TM.textContent=0;T.textContent='Tap to reveal. Long-press or right-click to flag.';paint()}function place(safe){let blocked=new Set([safe,...near(safe)]);let choices=Array.from({length:N*N},(_,i)=>i).filter(i=>!blocked.has(i));while(mines.size<M){let p=Math.floor(Math.random()*choices.length);mines.add(choices.splice(p,1)[0])}}function paint(){L.textContent=M-flags.size;cells.forEach((el,i)=>{let o=open.has(i),f=flags.has(i),n=near(i).filter(j=>mines.has(j)).length;el.className='cell'+(o?' open':'')+(o&&mines.has(i)?' mine':'')+(!o&&f?' flag':'');el.textContent=o?(mines.has(i)?'✹':n?n:''):f?'⚑':'';el.setAttribute('aria-label',o?(mines.has(i)?'Mine':n+' adjacent mines'):f?'Flagged cell':'Covered cell')})}function reveal(i){if(ended||flags.has(i)||open.has(i))return;if(!started){place(i);started=true;timer=setInterval(()=>TM.textContent=++sec,1000)}if(mines.has(i)){open.add(i);for(const m of mines)open.add(m);ended=true;clearInterval(timer);T.textContent='Boom! Try again.';paint();return}let todo=[i];while(todo.length){let x=todo.pop();if(open.has(x)||flags.has(x))continue;open.add(x);if(!near(x).some(j=>mines.has(j)))for(const j of near(x))if(!open.has(j)&&!mines.has(j))todo.push(j)}if(open.size===N*N-M){ended=true;clearInterval(timer);T.textContent='You cleared the minefield!'}paint()}function flag(i){if(ended||open.has(i))return;if(flags.has(i))flags.delete(i);else flags.add(i);paint()}for(let i=0;i<N*N;i++){let b=document.createElement('button');b.type='button';b.className='cell';b.addEventListener('click',()=>{if(flagMode)flag(i);else reveal(i)});b.addEventListener('contextmenu',e=>{e.preventDefault();flag(i)});let long=null,longTriggered=false;b.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;longTriggered=false;long=setTimeout(()=>{flag(i);longTriggered=true},550)});b.addEventListener('pointerup',()=>clearTimeout(long));b.addEventListener('pointercancel',()=>clearTimeout(long));b.addEventListener('click',e=>{if(longTriggered){e.stopImmediatePropagation();longTriggered=false}},true);B.append(b);cells.push(b)}mode.onclick=()=>{flagMode=!flagMode;mode.textContent='Mode: '+(flagMode?'Flag':'Reveal');mode.setAttribute('aria-pressed',String(flagMode))};document.querySelector('#reset').onclick=reset;reset();</script><script src="../controller.js" defer></script></body></html>
