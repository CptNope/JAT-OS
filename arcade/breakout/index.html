<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15181e"><title>Breakout — JAT Arcade</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;padding:16px;background:#15181e;color:#eef1f6;display:grid;place-items:center;font:15px/1.5 system-ui,sans-serif}main{text-align:center;width:min(100%,620px)}h1{font-size:clamp(25px,5vw,34px);margin:0 0 6px}p{color:#b7c2d5;margin:8px 0 14px}button{touch-action:manipulation;cursor:pointer;background:#2f6bff;color:#fff;border:1px solid #86aaff;border-radius:9px;padding:10px 14px;font:600 15px system-ui}button:focus-visible{outline:3px solid white;outline-offset:3px}button:disabled{opacity:.6;cursor:default}.hud{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;align-items:center;margin:14px 0}.stat{background:#252f40;border-radius:9px;padding:9px 15px}canvas{width:100%;display:block;border-radius:12px;background:#0d1726;touch-action:none;border:2px solid #3a4c64}.pad{display:flex;justify-content:center;gap:12px;margin:12px}.pad button{min-width:74px}small{color:#a4b1c3}</style></head><body><main><h1>Breakout</h1><p>Clear all the bricks. Move your paddle to keep the ball alive.</p><div class="hud"><span class="stat">Score: <b id="score">0</b></span><span class="stat">Lives: <b id="lives">3</b></span><button id="start">Start / Pause</button><button id="restart">New game</button></div><canvas id="c" width="600" height="440" aria-label="Breakout play field"></canvas><div class="pad"><button id="left">← Left</button><button id="right">Right →</button></div><p id="msg" aria-live="polite">Arrow keys, A/D or drag on the play field.</p><small>JAT Arcade · Plays directly in your browser</small></main><script>const c=document.querySelector('#c'),x=c.getContext('2d'),S=document.querySelector('#score'),L=document.querySelector('#lives'),M=document.querySelector('#msg');let bricks,p=255,bx=300,by=330,vx=3.5,vy=-4.5,score=0,lives=3,playing=false,left=false,right=false;function init(){bricks=Array.from({length:40},(_,i)=>({x:21+i%8*70,y:54+Math.floor(i/8)*25,alive:true}));p=255;score=0;lives=3;S.textContent=score;L.textContent=lives;serve();playing=false;M.textContent='Press Start to play.'}function serve(){bx=p+45;by=340;vx=3.5;vy=-4.5}function loop(){x.fillStyle='#0d1726';x.fillRect(0,0,600,440);for(const b of bricks)if(b.alive){x.fillStyle=['#7aaaff','#91c8ff','#71dac7','#ffd27d','#ff929c'][Math.floor((b.y-54)/25)];x.fillRect(b.x,b.y,65,19)}x.fillStyle='#e9f5ff';x.fillRect(p,404,90,12);x.beginPath();x.arc(bx,by,7,0,7);x.fill();if(playing){p=Math.max(0,Math.min(510,p+(right?7:0)-(left?7:0)));bx+=vx;by+=vy;if(bx<7||bx>593)vx*=-1;if(by<7)vy=Math.abs(vy);if(vy>0&&by>=397&&by<416&&bx>p-7&&bx<p+97){vy=-Math.abs(vy);vx=(bx-p-45)/10||1;by=397}for(const b of bricks)if(b.alive&&bx+7>b.x&&bx-7<b.x+65&&by+7>b.y&&by-7<b.y+19){b.alive=false;vy*=-1;score+=10;S.textContent=score;break}if(by>447){lives--;L.textContent=lives;if(!lives){playing=false;M.textContent='Game over. Try again.'}else serve()}if(bricks.every(b=>!b.alive)){playing=false;M.textContent='All bricks cleared! You win!'}}requestAnimationFrame(loop)}document.querySelector('#start').onclick=()=>{if(!lives||bricks.every(b=>!b.alive))init();playing=!playing;M.textContent=playing?'Keep the ball in play.':'Paused.'};document.querySelector('#restart').onclick=init;for(let d of ['left','right']){let b=document.querySelector('#'+d);b.addEventListener('pointerdown',e=>{b.setPointerCapture(e.pointerId);if(d==='left')left=true;else right=true});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>{if(d==='left')left=false;else right=false})}document.addEventListener('keydown',e=>{if(['ArrowLeft','a','ArrowRight','d'].includes(e.key)){e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a')left=true;else right=true}});document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')left=false;if(e.key==='ArrowRight'||e.key==='d')right=false});c.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch'){let r=c.getBoundingClientRect();p=Math.max(0,Math.min(510,(e.clientX-r.left)/r.width*600-45))}});document.addEventListener('visibilitychange',()=>{if(document.hidden)playing=false});init();loop();</script></body></html>
