<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15181e"><title>Snake — JAT Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#15181e;color:#f1f3f7;font:15px/1.4 system-ui,sans-serif;min-height:100dvh;display:grid;place-items:center;padding:16px}main{width:min(100%,570px);text-align:center}h1{margin:0 0 8px;font-size:clamp(24px,4vw,36px)}p{margin:6px 0 14px;color:#b6bfd0}button{background:#285ee6;border:1px solid #6490ff;color:white;font:inherit;font-weight:600;padding:10px 15px;border-radius:9px;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid white;outline-offset:3px}.stats{display:flex;justify-content:center;gap:16px;align-items:center;flex-wrap:wrap;margin:12px 0}.panel{padding:6px 14px;background:#252c39;border-radius:9px}.board{margin:12px auto;touch-action:none}small{color:#b6bfd0} .board{display:grid;grid-template-columns:repeat(18,1fr);gap:1px;width:min(100%,450px);aspect-ratio:1;background:#263145;border:3px solid #37445c;border-radius:8px;overflow:hidden}.cell{background:#1e293b}.cell.snake{background:#5cd8a2;border-radius:3px}.cell.head{background:#c5fae2}.cell.food{background:#ff8a78;border-radius:50%}.controls{display:grid;grid-template-columns:repeat(3,58px);justify-content:center;gap:5px;margin:10px}</style></head><body><main><h1>Snake</h1><p>Eat food, grow longer, and don't hit the wall.</p><div class="stats"><span class="panel">Score <b id="score">0</b></span><span class="panel">Best <b id="best">0</b></span><button id="toggle">Start</button><button id="reset">Reset</button></div><div id="board" class="board" role="img" aria-label="Snake game grid"></div><p id="status" aria-live="polite">Press Start to play.</p><div class="controls"><span></span><button data-dir="up">↑</button><span></span><button data-dir="left">←</button><button data-dir="down">↓</button><button data-dir="right">→</button></div><small>JAT Arcade • Keyboard and touch controls</small></main><script>const N=18,B=document.querySelector('#board'),T=document.querySelector('#status'),S=document.querySelector('#score'),H=document.querySelector('#best'),toggle=document.querySelector('#toggle');let snake,dir,next,food,score,timer=null;let best=Number(localStorage.getItem('jat-snake-best')||0);H.textContent=best;let cells=Array.from({length:N*N},()=>{let e=document.createElement('div');e.className='cell';B.append(e);return e});function draw(){cells.forEach((e,i)=>{e.className='cell';if(snake.some(p=>p===i))e.classList.add('snake');if(snake[0]===i)e.classList.add('head');if(food===i)e.classList.add('food')});S.textContent=score;if(score>best){H.textContent=best=score;localStorage.setItem('jat-snake-best',best)}}function spawn(){let free=cells.map((_,i)=>i).filter(i=>!snake.includes(i));food=free.length?free[Math.floor(Math.random()*free.length)]:-1}function reset(){pause();snake=[9*N+8,9*N+7,9*N+6];dir='right';next='right';score=0;spawn();draw();T.textContent='Press Start to play.'}function pause(){if(timer){clearInterval(timer);timer=null}toggle.textContent='Start'}function step(){dir=next;let h=snake[0],x=h%N,y=Math.floor(h/N),v={up:[x,y-1],down:[x,y+1],left:[x-1,y],right:[x+1,y]}[dir];if(v[0]<0||v[0]>=N||v[1]<0||v[1]>=N){pause();T.textContent='Game over — wall!';return}let newHead=v[1]*N+v[0],eating=newHead===food;if(snake.slice(0,eating?undefined:-1).includes(newHead)){pause();T.textContent='Game over — snake collision!';return}snake.unshift(newHead);if(eating){score+=10;spawn()}else snake.pop();draw();if(food<0){pause();T.textContent='You filled the board!'}}function setDir(d){if({up:'down',down:'up',left:'right',right:'left'}[dir]!==d)next=d}document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>setDir(b.dataset.dir));document.querySelector('#reset').onclick=reset;toggle.onclick=()=>{if(timer){pause();T.textContent='Paused.'}else{timer=setInterval(step,135);toggle.textContent='Pause';T.textContent='Use arrows, swipe, or direction buttons.'}};document.addEventListener('keydown',e=>{let d={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'}[e.key];if(d){e.preventDefault();setDir(d)}if(e.key===' '){e.preventDefault();toggle.click()}});let sx=0,sy=0;B.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});B.addEventListener('pointerup',e=>{let dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>20)setDir(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up')});document.addEventListener('visibilitychange',()=>{if(document.hidden&&timer){pause();T.textContent='Paused while away.'}});reset();</script></body></html>
