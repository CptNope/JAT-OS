<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15181e"><title>Pong — JAT Arcade</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;padding:16px;background:#15181e;color:#eef1f6;display:grid;place-items:center;font:15px/1.5 system-ui,sans-serif}main{text-align:center;width:min(100%,620px)}h1{font-size:clamp(25px,5vw,34px);margin:0 0 6px}p{color:#b7c2d5;margin:8px 0 14px}button{touch-action:manipulation;cursor:pointer;background:#2f6bff;color:#fff;border:1px solid #86aaff;border-radius:9px;padding:10px 14px;font:600 15px system-ui}button:focus-visible{outline:3px solid white;outline-offset:3px}button:disabled{opacity:.6;cursor:default}.hud{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;align-items:center;margin:14px 0}.stat{background:#252f40;border-radius:9px;padding:9px 15px}canvas{width:100%;display:block;border-radius:12px;background:#0d1726;touch-action:none;border:2px solid #3a4c64}.pad{display:flex;justify-content:center;gap:12px;margin:12px}.pad button{min-width:74px}small{color:#a4b1c3}</style></head><body><main><h1>Pong</h1><p>Beat the computer. First to 7 wins.</p><div class="hud"><span class="stat">You: <b id="p">0</b></span><span class="stat">Computer: <b id="a">0</b></span><button id="start">Start / Pause</button><button id="reset">Reset</button></div><canvas id="c" width="640" height="400" aria-label="Pong play field"></canvas><div class="pad"><button id="up">↑ Up</button><button id="down">↓ Down</button></div><p id="msg" aria-live="polite">Move with W/S, arrows, buttons or by dragging on the court.</p><small>JAT Arcade · Plays directly in your browser</small></main><script>const c=document.querySelector('#c'),x=c.getContext('2d'),P=document.querySelector('#p'),A=document.querySelector('#a'),msg=document.querySelector('#msg');let py=160,ay=160,bx=320,by=200,vx=4.6,vy=2.8,ps=0,as=0,play=false,up=false,down=false;function serve(d){bx=320;by=200;vx=d*4.6;vy=(Math.random()*3.5-1.75)||1.4}function reset(){ps=as=0;P.textContent=A.textContent=0;py=ay=160;serve(Math.random()<.5?-1:1);play=false;msg.textContent='Press Start to play.'}function frame(){x.fillStyle='#0d1726';x.fillRect(0,0,640,400);x.fillStyle='#637f9c';for(let y=4;y<400;y+=25)x.fillRect(317,y,6,13);x.fillStyle='#82e1d0';x.fillRect(15,py,12,80);x.fillStyle='#ffb28c';x.fillRect(613,ay,12,80);x.fillStyle='#fff';x.beginPath();x.arc(bx,by,8,0,Math.PI*2);x.fill();if(play){py=Math.max(0,Math.min(320,py+(down?7:0)-(up?7:0)));ay=Math.max(0,Math.min(320,ay+Math.max(-3.6,Math.min(3.6,by-40-ay))));bx+=vx;by+=vy;if(by<9||by>391)vy*=-1;if(bx<35&&bx>17&&vx<0&&by>py-6&&by<py+86){vx=Math.abs(vx)*1.035;vy=(by-(py+40))*.12;bx=35}if(bx>605&&bx<623&&vx>0&&by>ay-6&&by<ay+86){vx=-Math.abs(vx)*1.035;vy=(by-(ay+40))*.12;bx=605}if(bx<-10||bx>650){if(bx<-10)as++;else ps++;P.textContent=ps;A.textContent=as;if(ps>=7||as>=7){play=false;msg.textContent=ps>=7?'You won!':'Computer wins. Try again.'}else serve(bx<-10?1:-1)}}requestAnimationFrame(frame)}document.querySelector('#start').onclick=()=>{if(ps>=7||as>=7)reset();play=!play;msg.textContent=play?'Game on!':'Paused.'};document.querySelector('#reset').onclick=reset;const dir=(d,v)=>{if(d==='up')up=v;else down=v};['up','down'].forEach(d=>{let b=document.querySelector('#'+d);for(let ev of ['pointerdown','pointerup','pointercancel','pointerleave'])b.addEventListener(ev,e=>{if(ev==='pointerdown')b.setPointerCapture(e.pointerId);dir(d,ev==='pointerdown')})});document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','w','s','W','S'].includes(e.key)){e.preventDefault();dir(['ArrowUp','w','W'].includes(e.key)?'up':'down',true)}});document.addEventListener('keyup',e=>{if(['ArrowUp','ArrowDown','w','s','W','S'].includes(e.key))dir(['ArrowUp','w','W'].includes(e.key)?'up':'down',false)});c.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch'){let r=c.getBoundingClientRect();py=Math.max(0,Math.min(320,((e.clientY-r.top)/r.height)*400-40))}});document.addEventListener('visibilitychange',()=>{if(document.hidden)play=false});reset();frame();</script></body></html>
