<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15181e"><title>Connect Four — JAT Arcade</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;padding:16px;background:#15181e;color:#eef1f6;display:grid;place-items:center;font:15px/1.5 system-ui,sans-serif}main{text-align:center;width:min(100%,620px)}h1{font-size:clamp(25px,5vw,34px);margin:0 0 6px}p{color:#b7c2d5;margin:8px 0 14px}button{touch-action:manipulation;cursor:pointer;background:#2f6bff;color:#fff;border:1px solid #86aaff;border-radius:9px;padding:10px 14px;font:600 15px system-ui}button:focus-visible{outline:3px solid white;outline-offset:3px}button:disabled{opacity:.6;cursor:default}.hud{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;align-items:center;margin:14px 0}.stat{background:#252f40;border-radius:9px;padding:9px 15px}canvas{width:100%;display:block;border-radius:12px;background:#0d1726;touch-action:none;border:2px solid #3a4c64}.pad{display:flex;justify-content:center;gap:12px;margin:12px}.pad button{min-width:74px}small{color:#a4b1c3}.board{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:10px;background:#254eb3;border-radius:12px;margin:15px auto;width:min(100%,540px)}.slot{aspect-ratio:1;border:2px solid #183e94;border-radius:50%;padding:0;background:#131f36}.slot.player{background:#ffd56c}.slot.cpu{background:#f5939f}.slot:disabled{opacity:1}</style></head><body><main><h1>Connect Four</h1><p>Play against the computer. Connect four in any direction.</p><div class="hud"><span class="stat">You: <b style="color:#ffcc63">●</b></span><span class="stat">Computer: <b style="color:#f28d9a">●</b></span><button id="reset">New game</button></div><div id="board" class="board" role="grid" aria-label="Connect Four seven-column game board"></div><p id="msg" aria-live="polite">Your turn: select a column.</p><small>JAT Arcade · Plays directly in your browser</small></main><script>const B=document.querySelector('#board'),M=document.querySelector('#msg');const W=7,H=6;let grid,done,busy,turn=0;function reset(){turn++;grid=Array(W*H).fill(0);done=false;busy=false;M.textContent='Your turn: choose a column.';draw()}function at(c,r){return grid[r*W+c]}function place(c,player){for(let r=H-1;r>=0;r--)if(!at(c,r)){grid[r*W+c]=player;return r}return -1}function win(p){for(let r=0;r<H;r++)for(let c=0;c<W;c++)if(at(c,r)===p)for(let [dx,dy] of [[1,0],[0,1],[1,1],[1,-1]]){let good=true;for(let k=1;k<4;k++){let x=c+dx*k,y=r+dy*k;if(x<0||x>=W||y<0||y>=H||at(x,y)!==p){good=false;break}}if(good)return true;return false}function columns(){return [3,2,4,1,5,0,6].filter(c=>at(c,0)===0)}function scoreMove(c,p){let r=place(c,p);if(r<0)return false;let result=win(p);grid[r*W+c]=0;return result}function cpu(){if(done)return;let choices=columns();if(!choices.length){done=true;M.textContent='Draw!';draw();return}let c=choices.find(c=>scoreMove(c,2))??choices.find(c=>scoreMove(c,1))??choices[Math.floor(Math.random()*Math.min(choices.length,3))];place(c,2);busy=false;if(win(2)){done=true;M.textContent='Computer wins. Try again!'}else if(!columns().length){done=true;M.textContent='Draw!'}else M.textContent='Your turn.';draw()}function play(c){if(done||busy||at(c,0))return;place(c,1);if(win(1)){done=true;M.textContent='You win!';draw();return}if(!columns().length){done=true;M.textContent='Draw!';draw();return}busy=true;M.textContent='Computer thinking…';draw();let n=turn;setTimeout(()=>{if(n===turn)cpu()},360)}function draw(){B.replaceChildren();for(let r=0;r<H;r++)for(let c=0;c<W;c++){let b=document.createElement('button');b.className='slot '+(at(c,r)===1?'player':at(c,r)===2?'cpu':'');b.type='button';b.title='Place in column '+(c+1);b.setAttribute('aria-label','Column '+(c+1)+', row '+(r+1)+(at(c,r)===1?', your disc':at(c,r)===2?', computer disc':', empty'));b.disabled=done||busy||!!at(c,0);b.onclick=()=>play(c);B.append(b)}}document.querySelector('#reset').onclick=reset;document.addEventListener('keydown',e=>{if(/^[1-7]$/.test(e.key))play(Number(e.key)-1)});reset();</script><script src="../controller.js" defer></script></body></html>
